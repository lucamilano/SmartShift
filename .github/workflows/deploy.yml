name: Checks and Cloudflare deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smartshift-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build:cloudflare
      - run: npm run typecheck
      - name: Deploy production
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: cec6ff6e6e178ec99262e44cd53c119e
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo '::error::Aggiungere il repository secret CLOUDFLARE_API_TOKEN. Vedere CLOUDFLARE.md, sezione Deploy automatico.'
            exit 1
          fi
          npm run db:migrate:remote
          npx opennextjs-cloudflare deploy
          npm run deploy:pages
      - name: Check public site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: node scripts/check-public.mjs
